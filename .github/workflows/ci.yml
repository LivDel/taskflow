name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_MIN: 75

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires + couverture
        run: npm run test:coverage

      - name: Couverture (seuil ${{ env.COVERAGE_MIN }} %)
        run: |
          summary=coverage/coverage-summary.json
          lines=$(jq -r '.total.lines.pct' "$summary")
          {
            echo "### Couverture de l'API (Node ${{ matrix.node }})"
            echo ""
            echo "| Métrique | Couverture |"
            echo "|---|---|"
            for metric in lines statements functions branches; do
              echo "| ${metric} | $(jq -r ".total.${metric}.pct" "$summary") % |"
            done
            echo ""
            echo "Seuil bloquant sur les lignes : **${COVERAGE_MIN} %**"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$lines" -v min="$COVERAGE_MIN" 'BEGIN { exit !(p < min) }'; then
            echo "::error title=Couverture insuffisante::lignes ${lines} % < seuil ${COVERAGE_MIN} %"
            exit 1
          fi
          echo "Couverture des lignes : ${lines} % (seuil ${COVERAGE_MIN} %)"

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Tests d'intégration (PostgreSQL 16)
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests (Vitest) + couverture
        run: |
          npm run test:coverage
          {
            echo "### Couverture du front (information, non bloquante)"
            echo ""
            echo "Lignes : $(jq -r '.total.lines.pct' coverage/coverage-summary.json) %"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (Vite)
        run: npm run build

      - name: Artefact front-dist
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist/
          retention-days: 7
          if-no-files-found: error
